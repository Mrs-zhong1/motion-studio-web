name: R22 Visual Refinement Contract
on:
  push:
    branches:
      - release/r18-r21-acceptance-gates
    paths:
      - 'stage9/visual-refinement-r22.mjs'
      - 'stage9/build-offline.mjs'
      - 'stage9/tests/test_r22_visual_refinement.mjs'
      - '.github/workflows/r22-visual-refinement.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test R22 single-injection, responsive and reduced motion contracts
        run: node --test stage9/tests/test_r22_visual_refinement.mjs
