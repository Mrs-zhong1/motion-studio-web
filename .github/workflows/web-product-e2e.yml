name: Motion Studio Web Product E2E
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage9/Motion-Studio-Unified-Editor.html'
      - 'stage9/tests/test_web_product_e2e.py'
      - 'stage9/build-offline.mjs'
      - '.github/workflows/web-product-e2e.yml'
permissions:
  contents: read
jobs:
  web-product-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: stage9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned rendering dependencies
        run: npm install --no-audit --no-fund
      - name: Generate actual standalone Web editor
        run: npm run build
      - name: Verify offline Three.js bundle
        run: python tests/check_build.py
      - name: Install Playwright browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Real browser edit-save-reopen-export smoke
        run: python tests/test_web_product_e2e.py
        env:
          MOTION_BROWSER: ${{ matrix.browser }}
      - name: Archive browser reports and generated HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-web-product-e2e-${{ matrix.browser }}
          path: |
            stage9/WEB_PRODUCT_E2E_RESULT_*.json
            stage9/WEB_PRODUCT_E2E_PROJECT_*.json
            stage9/WEB_PRODUCT_E2E_EXPORTED_*.html
            stage9/Motion-Studio-Stage15-Meshopt-OFFLINE.html
            stage9/BUILD_MANIFEST.json
          if-no-files-found: warn
