name: Motion Studio Web Product E2E
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage9/Motion-Studio-Unified-Editor.html'
      - 'stage9/tests/test_web_product_e2e.py'
      - 'stage9/tests/test_product_restructure.py'
      - 'stage9/build-offline.mjs'
      - '.github/workflows/web-product-e2e.yml'
permissions:
  contents: read
jobs:
  web-product-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: stage9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned rendering dependencies
        run: npm install --no-audit --no-fund
      - name: Generate actual standalone Web editor
        run: npm run build
      - name: Verify offline Three.js bundle
        run: python tests/check_build.py
      - name: Install Playwright browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Real browser edit-save-reopen-export smoke
        run: python tests/test_web_product_e2e.py
        env:
          MOTION_BROWSER: ${{ matrix.browser }}
      - name: U1-U4 image-led discovery and blank editor regression
        if: matrix.browser == 'chromium'
        run: python tests/test_u1_u4_regression.py
      - name: Template discovery, preview and three-pane editor journey
        run: python tests/test_product_restructure.py
        env:
          MOTION_BROWSER: ${{ matrix.browser }}
      # GitHub Actions artifact storage quota is exhausted in this repository.
      # Record the evidence in job logs and GitHub's step summary without uploading large HTML.
      - name: Publish browser result in job summary (zero artifact storage)
        if: always()
        shell: bash
        run: |
          echo "### Motion Studio E2E — ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f WEB_PRODUCT_E2E_RESULT_${{ matrix.browser }}.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat WEB_PRODUCT_E2E_RESULT_${{ matrix.browser }}.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Result JSON unavailable: build, setup, or browser launch failed before result creation." >> "$GITHUB_STEP_SUMMARY"
          fi
