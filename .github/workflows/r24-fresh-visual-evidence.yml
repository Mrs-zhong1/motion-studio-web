name: R33 Fresh Full-Story Screenshot Evidence
on:
  workflow_dispatch:
  push:
    branches:
      - release/r18-r21-acceptance-gates
    paths:
      - 'stage9/story-art-direction-r23.mjs'
      - 'stage9/r30-cinematic-trial.mjs'
      - 'stage9/r31-cinematic-continuity.mjs'
      - 'stage9/ai-assets/**'
      - 'stage9/tests/test_r33_native_scroll_acceptance.py'
      - 'stage9/visual-refinement-r22.mjs'
      - 'stage9/tests/test_template_visual_audit.py'
      - '.github/workflows/r24-fresh-visual-evidence.yml'
permissions:
  contents: write
concurrency:
  group: motion-studio-r18-ai-review-deploy
  cancel-in-progress: false
jobs:
  fresh-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: stage9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser editor packages
        run: npm install --no-audit --no-fund
      - name: Generate strict original-AI current R33 offline HTML from original AI media
        run: npm run build
        env:
          MOTION_REQUIRE_AI_ASSETS: '1'
      - name: Install real browser for screenshot capture
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture all template opening, middle, ending and immersive previews
        run: python tests/test_template_visual_audit.py
        env:
          MOTION_SCREENSHOT_DIR: ${{ runner.temp }}/r33-actual-screenshots
      - name: Publish generated screenshot run metadata
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os,pathlib
          p=pathlib.Path("TEMPLATE_VISUAL_AUDIT.json")
          j=json.loads(p.read_text())
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"r24-actual-screenshots"
          images=sorted(folder.glob("*.png"))
          print("# R33 — freshly rendered 8-template story screenshots")
          print("Source commit: ${{ github.sha }}")
          print("Audit status:",j["status"])
          print("Template × viewport records:",len(j["templates"]))
          print("Actual PNG screenshots:",len(images))
          print("These are browser captures of this revision, not professional art-direction approval.")
          PY
      - name: Upload actual screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: r33-story-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/r24-actual-screenshots/*.png
          retention-days: 14
      - name: Upload structured geometry and story evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: r33-story-geometry-${{ github.sha }}
          path: stage9/TEMPLATE_VISUAL_AUDIT.json
          retention-days: 14

      - name: Convert 80 actual browser screenshots to compressed review WebP
        shell: bash
        run: |
          python -m pip install 'Pillow==11.3.0'
          python - <<'PY'
          import hashlib,html,json,os,pathlib
          from PIL import Image
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'r33-actual-screenshots'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'r33-visual-gallery'
          target.mkdir(parents=True,exist_ok=True)
          shots=sorted(src.glob('*.png'))
          assert len(shots)==80,f'Expected full 8 x 2 x 5 screenshots, got {len(shots)}'
          results={}
          for item in shots:
              with Image.open(item) as im:
                  im.load()
                  im=im.convert('RGB')
                  if im.width>1400:im.thumbnail((1400,1400))
                  destination=target/(item.stem+'.webp')
                  im.save(destination,format='WEBP',quality=80,method=5)
              results[item.stem]={
                  'image':destination.name,'bytes':destination.stat().st_size,
                  'sha256':hashlib.sha256(destination.read_bytes()).hexdigest()}
          templates=['editorial','product-3d','cinematic','architecture','agency','fashion','gallery','saas']
          cards=[]
          for template in templates:
              cards.append('<section id="'+template+'"><h2>'+template+'</h2><div class="shots">')
              for device in ['desktop','mobile']:
                  for label,stem in [('Preview',f'{template}-preview-{device}'),
                                     ('Immersive',f'{template}-immersive-{device}'),
                                     ('Opening',f'{template}-{device}'),
                                     ('Middle',f'{template}-chapter3-{device}'),
                                     ('Ending',f'{template}-ending-{device}')]:
                      assert stem in results,stem
                      cards.append(f'<figure><img loading="lazy" src="{results[stem]["image"]}" alt="{template} {device} {label} screenshot" /><figcaption>{device} / {label}</figcaption></figure>')
              cards.append('</div></section>')
          css='body{font:14px system-ui;margin:0 auto;padding:24px;max-width:1500px;background:#101314;color:#f4f2ec}h1{font-size:clamp(28px,5vw,55px);letter-spacing:-.06em}h2{text-transform:uppercase;letter-spacing:.05em;border-top:1px solid #505656;padding-top:22px;margin-top:60px}nav{display:flex;flex-wrap:wrap;gap:12px}a{color:#cceaaa}figure{margin:0;border:1px solid #515653;border-radius:11px;padding:8px;background:#1e2324}img{width:100%;height:auto;display:block;border-radius:6px}figcaption{padding:10px;font-size:12px;color:#c9ccc3}.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}.note{background:#242826;padding:12px;border:1px solid #6c7164;border-radius:8px;color:#f1cfae}'
          links=''.join(f'<a href="#{x}">{x}</a>' for x in templates)
          source=os.environ['GITHUB_SHA']
          body='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Studio R33 visual review</title><style>'+css+'</style></head><body><h1>Motion Studio / Visual Review</h1><p class="note">Real Chromium captures from exact source commit '+source[:12]+'. Current AI pack contains 33 collage crops. This gallery is for HUMAN QUALITY REVIEW, not publication approval.</p><p>80 browser screenshots · 8 templates · desktop and mobile · five story views</p><nav>'+links+'</nav>'+''.join(cards)+'</body></html>'
          (target/'index.html').write_text(body,encoding='utf-8')
          (target/'REVIEW_CAPTURE.json').write_text(json.dumps({'sourceCommit':source,'screenshots':results,'artDirectionApproved':False,'productionEligible':False},indent=2)+chr(10))
          print('R33 true-browser WebP review bytes:',sum(x['bytes'] for x in results.values()))
          PY
      - name: Publish visual-review gallery to isolated Pages folder (NEVER root)
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/r33-pages-worktree" origin/gh-pages
          target="$RUNNER_TEMP/r33-pages-worktree"
          test -f "$target/r18-ai-review/index.html"
          mkdir -p "$target/r33-visual-review"
          cp -f "$RUNNER_TEMP/r33-visual-gallery/"* "$target/r33-visual-review/"
          cd "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add r33-visual-review
          if ! git diff --cached --quiet; then
            git commit -m "R33 screenshot gallery ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
          test -f r18-ai-review/index.html
          echo "R33 visual review URL: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/r33-visual-review/" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify real published gallery HTML and source revision
        working-directory: .
        run: |
          set -euo pipefail
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/r33-visual-review/"
          matched=0
          for attempt in $(seq 1 24); do
            observed="$(curl -fsSL "${url}REVIEW_CAPTURE.json" 2>/dev/null | python -c 'import sys,json;print(json.load(sys.stdin).get("sourceCommit",""))' 2>/dev/null || true)"
            if [ "$observed" = "$GITHUB_SHA" ] && curl -fsSL "${url}index.html" -o "$RUNNER_TEMP/r33-live-index.html"; then
              matched=1;break
            fi
            sleep 5
          done
          test "$matched" -eq 1
          echo "R33 public screenshot gallery exact SHA verified: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
