name: R26 Hybrid Zero-Cost Visual Pilot
on:
  push:
    branches:
      - release/r18-r21-acceptance-gates
    paths:
      - 'stage9/r26_hybrid_pilot.py'
      - 'stage9/tests/test_r26_hybrid_pilot.py'
      - 'release/R26_HYBRID_ASSET_PLAN.md'
      - '.github/workflows/r26-hybrid-zero-cost-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-review-only-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic raster renderer
        run: python -m pip install 'Pillow==11.3.0'
      - name: Test four-scene pilot and 33-slot inventory
        run: python -m unittest discover -s stage9/tests -p 'test_r26_hybrid_pilot.py' -v
      - name: Render four representative native-resolution pilot scenes
        run: python stage9/r26_hybrid_pilot.py --out r26-hybrid-pilot
      - name: Validate staged image bytes, dimensions, hashes and zero-cost provenance
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path('r26-hybrid-pilot')
          rows=json.loads((root/'replacement.json').read_text())
          assert len(rows)==4
          for row in rows:
            path=root/row['file']
            raw=path.read_bytes()
            assert hashlib.sha256(raw).hexdigest()==row['sha256']
            with Image.open(path) as image:
              image.load()
              assert image.size==(1600,900)
              assert image.format=='PNG'
            assert row['sourceType']=='procedural-vector-render'
            assert row['commercialUseTermsChecked'] is False
          print('R26 hybrid pilot: 4 native originals, 1600x900, hashes verified')
          print('Third-party assets: 0; paid API calls: 0; release eligibility: HOLD')
          PY
      - name: Upload review-only pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: r26-hybrid-zero-cost-pilot-${{ github.sha }}
          path: r26-hybrid-pilot/
          retention-days: 14
