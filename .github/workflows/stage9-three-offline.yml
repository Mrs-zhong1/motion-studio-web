name: Motion Studio Stage 9 - standalone Three.js + strict GLB WebGL test
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage9/**'
      - '!stage9/output/**'
      - '.github/workflows/stage9-three-offline.yml'
concurrency:
  group: stage9-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: stage9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed Three.js dependencies
        run: npm install --no-audit --no-fund
      - name: Build real offline Stage 9 HTML
        run: npm run build
      - name: Verify bundled Three.js, GLTFLoader, license, no remote imports
        run: python3 tests/check_build.py
      - name: Install headless Chromium and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate and validate deterministic complex skinned morph GLB fixture
        run: python tests/make_advanced_fixture.py
      - name: Strict animated PBR texture and pixel verification (SwiftShader)
        id: gpu
        continue-on-error: true
        run: python tests/test_browser.py
      - name: Stage 9 GLB compatibility, mobile layout, offline and drawing performance matrix
        id: matrix
        continue-on-error: true
        run: python tests/test_matrix.py
      - name: Reject invalid GLB without corrupting project or export
        id: invalid
        continue-on-error: true
        run: python tests/test_invalid_glb.py
      - name: Verify one shared Three.js scene and continuous camera across two GLB chapters
        id: shared
        continue-on-error: true
        run: python tests/test_shared_scene.py
      - name: Stage10 camera editor keyframes JSON roundtrip and shared Three.js path acceptance
        id: stage10
        continue-on-error: true
        run: python tests/test_stage10_camera.py
      - name: Verify Stage11 spline math and invalid path normalization
        id: stage11math
        continue-on-error: true
        run: node tests/test_stage11_math.mjs
      - name: Stage11 draggable keyframes live preview and exported 3D camera acceptance
        id: stage11
        continue-on-error: true
        run: python tests/test_stage11_timeline.py
      - name: Stage12 spline tangent math and continuity
        id: stage12math
        continue-on-error: true
        run: node tests/test_stage12_curve.mjs
      - name: Stage12 actual Three.js spatial gizmo pointer drag, axis constraints and live preview
        id: stage12
        continue-on-error: true
        run: python tests/test_stage12_gizmo.py
      - name: Stage13 independent Bezier in/out handle curve regression
        id: stage13math
        continue-on-error: true
        run: node tests/test_stage13_bezier.mjs
      - name: Stage13 real 3D tangent drag, project persistence and offline export
        id: stage13
        continue-on-error: true
        run: python tests/test_stage13_bezier.py
      - name: Commit generated HTML, actual browser evidence, and manifests to repository
        if: always()
        working-directory: .
        run: |
          mkdir -p stage9/output
          for f in Motion-Studio-Stage9-THREE-OFFLINE.html Motion-Studio-Stage10-Camera-Editor-OFFLINE.html Motion-Studio-Stage11-Timeline-OFFLINE.html Motion-Studio-Stage12-Spatial-Gizmo-OFFLINE.html Motion-Studio-Stage13-Bezier-OFFLINE.html THREE_LICENSE.txt BUILD_MANIFEST.json STAGE9-THREE-EXPORTED.html STAGE9-THREE-EXPORT.png STAGE9-THREE-BROWSER-RESULT.json STAGE9-MATRIX-RESULT.json STAGE9-Sample-Dual-Material-EXPORTED.html STAGE9-Sample-Textured-Animated-EXPORTED.html STAGE9-Sample-Dual-Material-CAPTURE.png STAGE9-Sample-Textured-Animated-CAPTURE.png STAGE9-Sample-Skinned-Morph-MultiClip-EXPORTED.html STAGE9-Sample-Skinned-Morph-MultiClip-CAPTURE.png STAGE9-INVALID-GLB-RESULT.json STAGE9-INVALID-GLB-RECOVERY.html STAGE9-SHARED-SCENE-RESULT.json STAGE9-SHARED-TWO-GLB-EXPORTED.html STAGE9-SHARED-SCENE.png STAGE10-CAMERA-RESULT.json STAGE10-CAMERA-EXPORTED.html STAGE10-CAMERA-CAPTURE.png STAGE10-CAMERA-PROJECT.json STAGE11-TIMELINE-RESULT.json STAGE11-TIMELINE-PROJECT.json STAGE11-TIMELINE-EXPORTED.html STAGE11-TIMELINE-CAPTURE.png STAGE12-GIZMO-RESULT.json STAGE12-GIZMO-PROJECT.json STAGE12-GIZMO-EXPORTED.html STAGE12-GIZMO-CAPTURE.png STAGE13-BEZIER-RESULT.json STAGE13-BEZIER-PROJECT.json STAGE13-BEZIER-EXPORTED.html STAGE13-BEZIER-CAPTURE.png; do
            if [ -f "stage9/$f" ]; then cp "stage9/$f" "stage9/output/$f"; fi
          done
          cat > stage9/output/CI_GATE.txt <<EOF
          WebGL software acceptance step: ${{ steps.gpu.outcome }}
          GLB compatibility matrix: ${{ steps.matrix.outcome }}
          Invalid GLB resilience: ${{ steps.invalid.outcome }}
          Shared 3D continuity: ${{ steps.shared.outcome }}
          Stage10 editable camera: ${{ steps.stage10.outcome }}
          Stage11 curve interpolation: ${{ steps.stage11math.outcome }}
          Stage11 timeline live WebGL: ${{ steps.stage11.outcome }}
          Stage12 tangent curve: ${{ steps.stage12math.outcome }}
          Stage12 real spatial gizmo: ${{ steps.stage12.outcome }}
          Stage13 in/out Bezier math: ${{ steps.stage13math.outcome }}
          Stage13 real Three.js handles: ${{ steps.stage13.outcome }}
          CI run: ${{ github.run_id }}
          Source SHA: ${{ github.sha }}
          Real hardware GPU / Safari: NOT TESTED
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stage9/output
          if ! git diff --cached --quiet; then
            git commit -m "Stage 9-13 CI: persist real offline HTML and GPU evidence [skip ci]"
            # Other commits (e.g. documentation) may land while browser tests run.
            # Rebase the generated-output commit onto current main, then push safely.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Output rebase conflict: human review required"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Generated evidence committed on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not persist outputs after 3 attempts"
                exit 1
              fi
            done
          fi
      - name: Gate production if software WebGL verification failed
        if: steps.gpu.outcome != 'success' || steps.matrix.outcome != 'success' || steps.invalid.outcome != 'success' || steps.shared.outcome != 'success' || steps.stage10.outcome != 'success' || steps.stage11math.outcome != 'success' || steps.stage11.outcome != 'success' || steps.stage12math.outcome != 'success' || steps.stage12.outcome != 'success' || steps.stage13math.outcome != 'success' || steps.stage13.outcome != 'success'
        run: |
          echo "Stage 9 GPU software acceptance failed. Inspect stage9/output/ in repository."
          exit 1
