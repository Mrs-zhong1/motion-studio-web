name: R52 Photography Rights Evidence Gate (report-only until complete)
on:
  push:
    branches:
      - design/r43-immersive-template-system
    paths:
      - 'release/R52_PHOTO_RIGHTS_REGISTER.csv'
      - 'release/validate_r52_photo_rights.py'
      - '.github/workflows/r52-photo-rights-gate.yml'
      - 'stage9/ai-assets/**'
  pull_request:
    paths:
      - 'release/R52_PHOTO_RIGHTS_REGISTER.csv'
      - 'release/validate_r52_photo_rights.py'
      - '.github/workflows/r52-photo-rights-gate.yml'
      - 'stage9/ai-assets/**'
permissions:
  contents: read
jobs:
  report-rights-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evidence without treating missing sourcing as CI infrastructure failure
        run: python release/validate_r52_photo_rights.py --allow-incomplete --report r52-photo-rights-report.json
      - name: Publish itemized rights HOLD report
        if: always()
        run: |
          echo "## R52 photography rights gate" >> "$GITHUB_STEP_SUMMARY"
          cat r52-photo-rights-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r52-photo-rights-report
          path: r52-photo-rights-report.json
          if-no-files-found: error
