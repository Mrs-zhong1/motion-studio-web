name: R26 Blender Procedural 3D Pilot (zero-cost)
on:
  push:
    branches:
      - release/r18-r21-acceptance-gates
      - design/r43-immersive-template-system
    paths:
      - 'stage9/r26_blender_pilot.py'
      - 'stage9/r26-storyboard.json'
      - 'stage9/tests/test_r26_hybrid_pilot.py'
      - 'stage9/validate_r26_media.py'
      - 'stage9/tests/test_r26_media_validator.py'
      - '.github/workflows/r26-blender-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-review-only-scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blender (open-source local renderer; retry transient mirror failures)
        run: |
          set -euxo pipefail
          # Ubuntu archive/security mirrors can return transient 503s during large Blender installs.
          # Retry the complete update+install transaction, not only apt-get update.
          installed=0
          for attempt in 1 2 3 4 5 6; do
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get -o Acquire::Retries=6 -o Acquire::http::Timeout=90 -o Acquire::https::Timeout=90 update
            if sudo apt-get -o Acquire::Retries=6 -o Acquire::http::Timeout=90 -o Acquire::https::Timeout=90 install -y --no-install-recommends blender libegl1 libgl1 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libglx-mesa0 libgl1-mesa-dri; then
              installed=1
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep $((attempt * 15))
            fi
          done
          test "$installed" -eq 1
          command -v blender
          blender --version
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'
      - name: Install independent image validator
        run: python -m pip install 'Pillow==11.3.0'
      - name: Run R26 hybrid inventory and Blender source safety tests
        run: python -m unittest discover -s stage9/tests -p 'test_r26_hybrid_pilot.py' -v
      - name: Run R26 33-slot provenance validator tests
        run: python -m unittest discover -s stage9/tests -p 'test_r26_media_validator.py' -v
      - name: Render four representative original 3D scenes
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euxo pipefail
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'
          blender --background --python stage9/r26_blender_pilot.py -- --out r26-blender-pilot --limit 4
      - name: Validate native pixels, unique hashes and review-only provenance
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path('r26-blender-pilot')
          rows=json.loads((root/'replacement.json').read_text())
          assert len(rows)==4
          assert len({r['sha256'] for r in rows})==4
          for row in rows:
            path=root/row['file']; raw=path.read_bytes()
            assert hashlib.sha256(raw).hexdigest()==row['sha256']
            with Image.open(path) as image:
              image.load()
              assert image.format=='PNG' and image.size==(1600,900)
            assert row['sourceType']=='procedural-3d-render'
            assert row['commercialUseTermsChecked'] is False
          print('R26 Blender pilot PASS: 4 independent 1600x900 PNG renders; hashes verified')
          print('No paid API, no model download, no third-party assets; human art-direction remains HOLD')
          PY
      - name: Upload Blender review artifact
        uses: actions/upload-artifact@v4
        with:
          name: r26-blender-3d-pilot-${{ github.sha }}
          path: r26-blender-pilot/
          retention-days: 14
