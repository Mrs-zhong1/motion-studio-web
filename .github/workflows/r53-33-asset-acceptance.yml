name: R53 33-Asset Integration Acceptance (fail closed)
on:
  push:
    branches:
      - design/r43-immersive-template-system
    paths:
      - 'release/R53_PRODUCTION_ASSET_REGISTER.json'
      - 'release/validate_r53_production_assets.py'
      - '.github/workflows/r53-33-asset-acceptance.yml'
      - 'stage9/ai-assets/**'
  pull_request:
    paths:
      - 'release/R53_PRODUCTION_ASSET_REGISTER.json'
      - 'release/validate_r53_production_assets.py'
      - '.github/workflows/r53-33-asset-acceptance.yml'
      - 'stage9/ai-assets/**'
permissions:
  contents: read
jobs:
  report-current-asset-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Validate all 33 replacement slots without manufacturing approval
        run: python release/validate_r53_production_assets.py --report r53-asset-report.json
      - name: Publish HOLD/PASS evidence
        if: always()
        run: |
          echo "## R53 33-asset acceptance" >> "$GITHUB_STEP_SUMMARY"
          cat r53-asset-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-33-asset-acceptance-report
          path: r53-asset-report.json
          if-no-files-found: error
