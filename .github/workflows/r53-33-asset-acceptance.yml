name: R53 33-Asset Integration Acceptance (fail closed)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-current-asset-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Run asset gate unit tests
        run: python -m unittest release.tests.test_asset_validation -v
      - name: Regenerate original procedural artwork from repository source
        run: python release/generate_r53_original_assets.py
      - name: Validate all 33 original slots without manufacturing approval
        env:
          MOTION_CANDIDATE_SHA: ${{ github.sha }}
        run: python release/validate_r53_production_assets.py --report r53-asset-report.json
      - name: Generate hash-verified contact sheet for human visual review
        run: python release/create_r53_review_contact_sheet.py
      - name: Publish HOLD/PASS evidence
        if: always()
        run: |
          echo "## R53 33-asset acceptance" >> "$GITHUB_STEP_SUMMARY"
          cat r53-asset-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-33-asset-acceptance-report
          path: |
            r53-asset-report.json
            r53-review-contact-sheet.png
          if-no-files-found: error
