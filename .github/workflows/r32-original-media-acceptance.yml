name: V1 R32 Native Artwork Acceptance (report-only until original replacement)
on:
  workflow_dispatch:
  push:
    branches: [release/r18-r21-acceptance-gates]
    paths:
      - 'stage9/ai-assets/**'
      - 'stage9/audit_r32_real_media.py'
      - 'stage9/tests/test_r32_real_media.py'
      - '.github/workflows/r32-original-media-acceptance.yml'
permissions:
  contents: read
jobs:
  audit-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pixel decoder for actual committed image files
        run: python -m pip install 'Pillow==11.3.0'
      - name: Regression proof native source is not equivalent to upscaled output
        run: python -m unittest discover -s stage9/tests -p 'test_r32_real_media.py' -v
      - name: Decode and audit all 39 current AI assets
        run: python stage9/audit_r32_real_media.py --out r32_media_result.json
      - name: Publish explicit technical HOLD and per-template backlog
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          x=json.load(open('r32_media_result.json'))
          s=x['summary']
          print('# R32 actual source image audit')
          print(f"**Release media eligibility: {'PASS' if s['productionMediaEligible'] else 'HOLD'}**")
          print(f"Decoded files: {s['decodedAndCheckedImages']}/39; collage or derived originals: {s['collageOrOtherSources']}; flagged images: {s['flaggedImages']}")
          print('| Template | Independently generated | Flagged chapters |')
          print('|---|---:|---|')
          for row in x['byTemplate']:
              print(f"| {row['template']} | {row['individualOriginals']} | {','.join(map(str,row['flaggedChapters'])) or 'none'} |")
          print('No image is automatically approved by this audit; human art direction remains HOLD.')
          PY
      - name: Assert current image library is correctly blocked, never silently approved
        run: |
          python - <<'PY'
          import json
          s=json.load(open('r32_media_result.json'))['summary']
          assert s['decodedAndCheckedImages']==39,s
          assert s['flaggedImages']==33,s
          assert s['productionMediaEligible'] is False
          print('EXPECTED HOLD: production is blocked by 33 original-media gaps')
          PY
