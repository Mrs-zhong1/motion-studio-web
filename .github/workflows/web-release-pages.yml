name: Motion Studio V1 Web Production — fail-closed exact-build release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stage9/**'
      - 'release/**'
      - '.github/workflows/web-release-pages.yml'
permissions:
  contents: write
concurrency:
  group: motion-studio-web-pages
  cancel-in-progress: false
jobs:
  v1-publish-exact-tested-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/motion-studio-web/
    defaults:
      run:
        working-directory: stage9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder and real browser testing tools
        working-directory: .
        run: |
          python -m pip install 'Pillow==11.3.0' playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Require SHA-bound human art approval and all original native images
        working-directory: .
        env:
          V1_APPROVED_SOURCE_SHA: ${{ vars.V1_APPROVED_SOURCE_SHA }}
        run: |
          python release/v1_release_preflight.py --phase candidate --source-sha "$GITHUB_SHA"
          python stage9/audit_r32_real_media.py --require-release
      - name: Build EXACT offline HTML once from verified 39 originals
        env:
          MOTION_REQUIRE_AI_ASSETS: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build
          python tests/check_build.py
          node --test tests/test_r31_story_continuity.mjs
          node test_ai_chapter_assets.mjs
      - name: Chromium actual product, 8 templates, R33 scroll and media
        env:
          MOTION_BROWSER: chromium
        run: |
          python tests/test_web_product_e2e.py
          python tests/test_product_restructure.py
          python tests/test_r30_cinematic_trial.py
          python tests/test_r33_native_scroll_acceptance.py
          python tests/test_template_visual_audit.py
          python tests/test_r16_cross_chapter.py
      - name: Firefox exact same built editor
        env:
          MOTION_BROWSER: firefox
        run: |
          python tests/test_web_product_e2e.py
          python tests/test_product_restructure.py
      - name: WebKit exact same built editor
        env:
          MOTION_BROWSER: webkit
        run: |
          python tests/test_web_product_e2e.py
          python tests/test_product_restructure.py
      - name: Genuine 3D PBR, GLB animation and WebGL compatibility checks
        run: |
          python tests/make_advanced_fixture.py
          python tests/test_browser.py
          python tests/test_matrix.py
          python tests/test_invalid_glb.py
          python tests/test_shared_scene.py
      - name: Stage exact TESTED HTML and immutable evidence manifest
        run: |
          mkdir -p "$RUNNER_TEMP/v1-dist"
          cp Motion-Studio-Stage15-Meshopt-OFFLINE.html "$RUNNER_TEMP/v1-dist/index.html"
          cp THREE_LICENSE.txt "$RUNNER_TEMP/v1-dist/THREE_LICENSE.txt"
          cp BUILD_MANIFEST.json "$RUNNER_TEMP/v1-dist/BUILD_MANIFEST.json"
          python - <<'PY'
          import json,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v1-dist'
          raw=(root/'index.html').read_bytes()
          manifest=json.loads((root/'BUILD_MANIFEST.json').read_text())
          assert len(raw)>250000
          assert manifest.get('offline') is True and manifest.get('aiOriginalMedia') is True
          assert manifest.get('editorBytes')==len(raw)
          content={'app':'Motion Studio Web V1','sourceCommit':os.environ['GITHUB_SHA'],
            'artifact':'index.html','bytes':len(raw),
            'sha256':hashlib.sha256(raw).hexdigest(),
            'browserGate':'Chromium Firefox WebKit tests passed same bytes',
            'aiOriginals':39,'fullVisualSignoffSource':'SHA-bound release approvals',
            'productionSmoke':'PENDING'}
          (root/'WEB_RELEASE.json').write_text(json.dumps(content,indent=2)+chr(10))
          (root/'SHA256SUMS.txt').write_text(content['sha256']+'  index.html'+chr(10))
          (root/'.nojekyll').write_text('')
          print('Ready to publish test-exact bytes',content['bytes'],content['sha256'])
          PY
      - name: Publish root only without FORCE and preserve all review pages
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          previous="$(git rev-parse origin/gh-pages)"
          echo "Previous rollback commit: $previous" >> "$GITHUB_STEP_SUMMARY"
          git worktree add --detach "$RUNNER_TEMP/v1-prod-pages" origin/gh-pages
          target="$RUNNER_TEMP/v1-prod-pages"
          test -f "$target/r18-ai-review/index.html"
          for filename in index.html THREE_LICENSE.txt BUILD_MANIFEST.json WEB_RELEASE.json SHA256SUMS.txt .nojekyll; do
            cp -f "$RUNNER_TEMP/v1-dist/$filename" "$target/$filename"
          done
          cd "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html THREE_LICENSE.txt BUILD_MANIFEST.json WEB_RELEASE.json SHA256SUMS.txt .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Production V1 approved ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
          test -f r18-ai-review/index.html
          cat WEB_RELEASE.json >> "$GITHUB_STEP_SUMMARY"
  v1-live-https-smoke:
    needs: v1-publish-exact-tested-build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install true-browser live verification
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Await exact source revision, not just a 200 HTTP status
        env:
          MOTION_STUDIO_URL: https://${{ github.repository_owner }}.github.io/motion-studio-web/
        run: |
          for attempt in $(seq 1 36); do
            deployed="$(curl -fsSL "${MOTION_STUDIO_URL}WEB_RELEASE.json" 2>/dev/null | python -c 'import json,sys;print(json.load(sys.stdin).get("sourceCommit",""))' 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "Exact V1 commit not observed on Pages; production smoke FAILED"
          exit 1
      - name: Real deployed HTTPS preview/edit/save/export and served HTML SHA
        env:
          MOTION_STUDIO_URL: https://${{ github.repository_owner }}.github.io/motion-studio-web/
        run: python stage9/tests/test_live_deployment.py
      - name: Record immutable live smoke evidence
        if: always()
        run: |
          echo '## V1.0 final live browser smoke' >> "$GITHUB_STEP_SUMMARY"
          test ! -f P5_LIVE_SMOKE.json || cat P5_LIVE_SMOKE.json >> "$GITHUB_STEP_SUMMARY"
          echo "If smoke fails, run v1-pages-rollback with the pre-publish gh-pages SHA, not a force push." >> "$GITHUB_STEP_SUMMARY"
