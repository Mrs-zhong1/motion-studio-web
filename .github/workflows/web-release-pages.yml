name: Motion Studio Web - gated Pages deployment
# One guarded release retry is triggered by this workflow change.
# Every publish still requires all 3 browsers and Three.js regression to pass.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stage9/Motion-Studio-Unified-Editor.html'
      - 'stage9/tests/test_web_product_e2e.py'
      - 'stage9/tests/test_product_restructure.py'
      - 'stage9/tests/test_live_deployment.py'
      - 'stage9/output/Motion-Studio-Stage15-Meshopt-OFFLINE.html'
      - 'stage9/output/BUILD_MANIFEST.json'
      - '.github/workflows/web-release-pages.yml'
concurrency:
  group: motion-studio-web-pages
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build-and-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: stage9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned offline editor
        run: |
          npm install --no-audit --no-fund
          npm run build
          python tests/check_build.py
      - name: Browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run actual edit-save-import-export browser journey
        run: python tests/test_web_product_e2e.py
        env:
          MOTION_BROWSER: ${{ matrix.browser }}
      - name: Verify template discovery, immersive preview and editor workspace
        run: python tests/test_product_restructure.py
        env:
          MOTION_BROWSER: ${{ matrix.browser }}
      - name: Verify browser-tested HTML matches committed release candidate
        run: |
          cmp Motion-Studio-Stage15-Meshopt-OFFLINE.html output/Motion-Studio-Stage15-Meshopt-OFFLINE.html
          sha256sum Motion-Studio-Stage15-Meshopt-OFFLINE.html | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record browser evidence without artifact storage
        if: always()
        run: |
          echo "### Release E2E — ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f WEB_PRODUCT_E2E_RESULT_${{ matrix.browser }}.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat WEB_PRODUCT_E2E_RESULT_${{ matrix.browser }}.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
  three-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: stage9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real offline 3D editor
        run: |
          npm install --no-audit --no-fund
          npm run build
          python tests/check_build.py
      - name: Install Chromium WebGL test environment
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build deterministic advanced GLB fixture
        run: python tests/make_advanced_fixture.py
      - name: Verify PBR, animation and GLB pixels
        run: python tests/test_browser.py
      - name: Verify multiple material, texture, animation and mobile tests
        run: python tests/test_matrix.py
      - name: Verify invalid GLB safely rejected
        run: python tests/test_invalid_glb.py
      - name: Verify shared scene and camera continuity
        run: python tests/test_shared_scene.py
      - name: Record 3D verification evidence without artifact storage
        if: always()
        run: |
          echo "### Release Three.js regression" >> "$GITHUB_STEP_SUMMARY"
          for result in STAGE9-THREE-BROWSER-RESULT.json STAGE9-MATRIX-RESULT.json STAGE9-INVALID-GLB-RESULT.json STAGE9-SHARED-SCENE-RESULT.json; do
            if [ -f "$result" ]; then
              echo "#### $result" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  publish:
    outputs:
      page_url: ${{ steps.pages-url.outputs.url }}
    needs: [build-and-browser-gate, three-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact committed candidate verified by all three browsers
        run: |
          mkdir -p release-candidate
          cp stage9/output/Motion-Studio-Stage15-Meshopt-OFFLINE.html release-candidate/
          cp stage9/output/THREE_LICENSE.txt release-candidate/
          cp stage9/output/BUILD_MANIFEST.json release-candidate/
      - name: Verify release candidate matches its build manifest
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('release-candidate')
          html=root/'Motion-Studio-Stage15-Meshopt-OFFLINE.html'
          license=root/'THREE_LICENSE.txt'
          manifest=json.loads((root/'BUILD_MANIFEST.json').read_text(encoding='utf-8'))
          assert html.is_file() and license.is_file()
          assert html.stat().st_size>250000
          assert manifest.get('offline') is True
          assert manifest.get('editorBytes')==html.stat().st_size
          print('Publishing exact browser-tested HTML:',html.stat().st_size,'bytes')
          PY
      - name: Prepare static Pages site, manifest and SHA256
        run: |
          mkdir -p dist
          cp release-candidate/Motion-Studio-Stage15-Meshopt-OFFLINE.html dist/index.html
          cp release-candidate/THREE_LICENSE.txt dist/THREE_LICENSE.txt
          cp release-candidate/BUILD_MANIFEST.json dist/BUILD_MANIFEST.json
          python - <<'PY'
          import json,hashlib,pathlib,os
          root=pathlib.Path("dist")
          index=root/"index.html"
          raw=index.read_bytes()
          assert len(raw)>250000, "Refusing to publish incomplete editor"
          html=raw.decode("utf-8")
          assert "offline-glb-scene" in html and "exportPage" in html
          manifest={"app":"Motion Studio Web","sourceCommit":os.environ["GITHUB_SHA"],
                    "browserGate":"three Playwright browser engines passed",
                    "artifact":"index.html","bytes":len(raw),
                    "sha256":hashlib.sha256(raw).hexdigest(),
                    "deploymentSmoke":"PENDING (not claimed by this workflow)",
                    "nativeSafari":"NOT TESTED",
                    "realDevicePerformance":"NOT TESTED"}
          (root/"WEB_RELEASE.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf8")
          (root/".nojekyll").write_text("")
          PY
          sha256sum dist/index.html > dist/SHA256SUMS.txt
      - name: Set expected GitHub Pages URL
        id: pages-url
        run: echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
      - name: Publish exact tested bytes to gh-pages branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          cat WEB_RELEASE.json >> "$GITHUB_STEP_SUMMARY"

  live-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for real deployed site
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wait for the exact release manifest to reach GitHub Pages
        env:
          MOTION_STUDIO_URL: ${{ needs.publish.outputs.page_url }}
        run: |
          expected="${GITHUB_SHA}"
          for attempt in $(seq 1 36); do
            deployed=$(curl -fsSL "${MOTION_STUDIO_URL}WEB_RELEASE.json" | python -c 'import json,sys; print(json.load(sys.stdin).get("sourceCommit", ""))' 2>/dev/null || true)
            if [ "$deployed" = "$expected" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not publish source commit $expected within six minutes"
          exit 1
      - name: Verify live HTTPS page, editor, project save and HTML export
        run: python stage9/tests/test_live_deployment.py
        env:
          MOTION_STUDIO_URL: ${{ needs.publish.outputs.page_url }}
      - name: Record deployment smoke evidence without artifact storage
        if: always()
        run: |
          if [ -f P5_LIVE_SMOKE.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat P5_LIVE_SMOKE.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
